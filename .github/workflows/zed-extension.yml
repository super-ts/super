# Builds the Zed extension for the target Zed compiles it to, whenever it changes.
name: zed-extension

on:
  push:
    branches: [main]
    paths: ['editors/zed/**', '.github/workflows/zed-extension.yml']
  pull_request:
    paths: ['editors/zed/**', '.github/workflows/zed-extension.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
