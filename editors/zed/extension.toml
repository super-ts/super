id = "super-lang"
name = "Super"
version = "0.1.0"
schema_version = 1
authors = ["Dimitri Lahaye"]
description = ".super files for the Super framework: highlighting, errors, completion, formatting."
repository = "https://github.com/super-ts/super"

[language_servers.super-language-server]
name = "Super Language Server"
languages = ["Super"]

# The server is installed from npm (see src/lib.rs): only this package.
[[capabilities]]
kind = "npm:install"
package = "@super-ts/language-server"

# The .super grammar: Zed's TSX grammar (forked) extended with statements written between
# tags, in its public repository (submodule editors/tree-sitter-super). Zed clones and compiles it
# at this revision (here the v0.1.0 tag): after changing the grammar, push it there
# then update `rev`.
[grammars.super]
repository = "https://github.com/super-ts/tree-sitter-super"
rev = "b8c59a98fd8c51778723f44d06f1b7e6252e5803"
